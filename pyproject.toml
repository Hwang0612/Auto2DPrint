[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "printplan-ai"
version = "1.1.0"
description = "PDF floor-plan to G-code pipeline for large-scale 3D concrete printing"
authors = [{ name = "Hoang Khieu" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymupdf>=1.24",
    "shapely>=2.0",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.28",
    "numpy>=1.24",
    "networkx>=3.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["printplan_ai*"]
